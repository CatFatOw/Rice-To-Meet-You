name: continuous-integration-checks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///./local.db"
      JWT_KEY: "dev-secret-key"
      CLAUDE_API_KEY: "fake-ci-key"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v3
        with:
          check-latest: true
      - run: python -m pip install --upgrade pip
      - run: if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi
      - run: python3 -m compileall -q app
      - run: python3 -m json.tool postman_dataset_routes_collection.json >/dev/null
      - run: python3 -c "import sys; sys.path.insert(0, 'app'); import main"
      - run: pytest
